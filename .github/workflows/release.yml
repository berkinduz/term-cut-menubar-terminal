name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test
        run: swift test
      - name: Build universal application
        run: ./scripts/build-app.sh --universal
      - name: Package
        run: ./scripts/package-dmg.sh
      - name: Checksums
        working-directory: build
        run: shasum -a 256 term-cut.dmg term-cut.zip > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/term-cut.dmg build/term-cut.zip build/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "term-cut $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
